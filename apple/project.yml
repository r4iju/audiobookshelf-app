name: AudiobookshelfNative
options:
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: C7X9BCC7LP
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  AudiobookshelfNative:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [ReaderAssets]
      - path: App/ReaderAssets
        type: folder
        buildPhase: resources
      - Playback
      - Export/Sources/YearExport
      - Localization/Sources/NativeLocalization
      - Diagnostics/Sources/NativeDiagnostics
      - path: Adoption
        excludes: ["*.md"]
      - ../tvos/Core/Sources/TVCore
      - Migration/Sources/LegacyMigration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forkzed.audiobookshelf.native.preview
        CODE_SIGN_ENTITLEMENTS: App/Preview.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Audiobookshelf Native
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSPhotoLibraryAddUsageDescription: Save your year in review image to Photos.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.audiobookshelf.legacy-migration
            UTTypeDescription: Audiobookshelf Migration Package
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [absmigration]
        NSLocalNetworkUsageDescription: Connect directly to your Audiobookshelf server on your local network.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.forkzed.audiobookshelf.native.preview.openid
            CFBundleURLSchemes: [audiobookshelf-native-preview]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  NativeJourneyTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AudiobookshelfNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.forkzed.audiobookshelf.native.preview.uitests
  # Runs without a host app so the stores under test use injected storage and never share the
  # app's background download session.
  NativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NativeTests
      - path: Adoption
        excludes: ["*.md"]
      - App/NativeDownloads.swift
      - App/ReadingStore.swift
      - App/CatalogStore.swift
      - App/WaitingWrites.swift
      - App/NativeRealtime.swift
      - Localization/Sources/NativeLocalization
      - Playback
      - ../tvos/Core/Sources/TVCore
      - Migration/Sources/LegacyMigration
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.forkzed.audiobookshelf.native.preview.nativetests
schemes:
  AudiobookshelfNative:
    build:
      targets:
        AudiobookshelfNative: all
        NativeJourneyTests: [test]
    test:
      targets: [NativeJourneyTests]
  NativeTests:
    build:
      targets:
        NativeTests: [test]
    test:
      targets: [NativeTests]

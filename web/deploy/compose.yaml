name: leafwake
services:
  leafwake:
    build:
      context: ..
      args:
        ABS_WEB_BASE_PATH: ${ABS_WEB_BASE_PATH:-}
    image: ${LEAFWAKE_IMAGE:-leafwake:local}
    restart: unless-stopped
    environment:
      LEAFWAKE_SETUP_KEY: ${LEAFWAKE_SETUP_KEY:?set a private first-owner setup key}
      LEAFWAKE_MEDIA_ROOTS: /media
    ports: ["${LEAFWAKE_BIND:-127.0.0.1:3000}:3000"]
    volumes:
      - leafwake-data:/data
      - ${LEAFWAKE_MEDIA_DIR:?set the original media directory}:/media:ro
      - ${LEAFWAKE_IMPORT_DIR:?set a private snapshot import directory}:/imports:ro
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  leafwake-data:

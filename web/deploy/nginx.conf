# One origin for the Audiobookshelf server and the browser client under /web. OpenID sign-in needs this: the
# server keeps the sign-in in a cookie on its own origin, and the client finishes it from the same origin.
# "audiobookshelf" must be the server container's name or network alias; "abs-web" is the client's compose service.

# Docker's DNS, asked per request so a recreated container is found at its new address.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

# The server picks https or http for OpenID return addresses from this header. When TLS ends at a proxy in front of
# this one, that proxy's header is kept; otherwise it is this connection's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  # Uploads and podcast downloads are the server's business; nginx does not cap them.
  client_max_body_size 0;

  proxy_http_version 1.1;
  # The server builds OpenID redirect addresses from Host, so it must see the address people use, port included.
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  # /web itself and everything below it, but not, say, /webhooks.
  location ~ ^/web(/|$) {
    set $abs_web http://abs-web:3000;
    proxy_pass $abs_web;
  }

  location / {
    set $abs_server http://audiobookshelf:80;
    proxy_pass $abs_server;
    # Streams, downloads and the live socket stay open far longer than a page request.
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}

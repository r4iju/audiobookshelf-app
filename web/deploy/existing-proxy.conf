# For a reverse proxy that already serves the Audiobookshelf server: include this in that server block, before or
# beside its "location /", and run only the client container (docs/DEPLOYMENT.md, "Using your own reverse proxy").
# "abs-web" is the client's compose service; the proxy must be on the network the client joined. Nothing here
# changes how the server itself is proxied.

# /web itself and everything below it, but not, say, /webhooks. The path is passed on unchanged.
location ~ ^/web(/|$) {
  # Docker's DNS, asked per request so a recreated client container is found at its new address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $abs_web http://abs-web:3000;
  proxy_pass $abs_web;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

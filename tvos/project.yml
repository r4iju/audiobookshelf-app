name: AudiobookshelfTV
options:
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: C7X9BCC7LP
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  AudiobookshelfTV:
    type: application
    platform: tvOS
    sources:
      - App
      - ../apple/Playback
      - Core/Sources/TVCore
      - ../apple/Localization/Sources/NativeLocalization
      - ../apple/Diagnostics/Sources/NativeDiagnostics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forkzed.audiobookshelf.tv
        PRODUCT_NAME: AudiobookshelfTV
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Audiobook Loft
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your Audiobook Loft or compatible Audiobookshelf server on your local network.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connect to your Audiobook Loft or compatible Audiobookshelf server on your local network.
  TVJourneyTests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [UITests]
    dependencies:
      - target: AudiobookshelfTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.forkzed.audiobookshelf.tv.uitests
  TVAppTests:
    type: bundle.unit-test
    platform: tvOS
    sources: [AppTests]
    dependencies:
      - target: AudiobookshelfTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.forkzed.audiobookshelf.tv.apptests
schemes:
  AudiobookshelfTV:
    build:
      targets:
        AudiobookshelfTV: all
        TVJourneyTests: [test]
        TVAppTests: [test]
    test:
      targets: [TVAppTests, TVJourneyTests]
    run:
      config: Debug
    archive:
      config: Release
